[workspace]
resolver = "2"
members = [
    "crates/ephemeris",
    "crates/atlas",
    "crates/jyotish-core",
    "crates/store",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.93"
repository = "https://github.com/turgaydogusan/jyotish-desk"

[workspace.dependencies]
thiserror = "2"
