[package]
name = "jyotish-desk"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
name = "jyotish_desk_lib"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
atlas = { path = "../../crates/atlas" }
ephemeris = { path = "../../crates/ephemeris" }
jyotish-core = { path = "../../crates/jyotish-core", features = ["specta"] }
store = { path = "../../crates/store", features = ["specta"] }
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
# Normal bağımlılık (dev değil): özellik birleşimiyle Tauri'nin IPC ayrıştırması da float'ları
# bit düzeyinde korur (Plan 06 incelemesi D1). serde_json zaten Tauri üzerinden ağaçtadır.
serde_json = { version = "1", features = ["float_roundtrip"] }
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
specta-typescript = "0.0.15"
# Dosya seçme/kaydetme pencereleri Rust tarafında açılır (`DialogExt`); arayüze yol seçtiren
# bir komut ve yetenek (capability) yoktur. Apache-2.0 OR MIT.
tauri-plugin-dialog = "=2.8.4"

[dev-dependencies]
tempfile = "3"
