name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm --dir app install --frozen-lockfile
      # Yayın betikleri (sürüm tutarlılığı, latest.json); bağımlılıksız, Node'un kendi test koşucusu.
      - run: node --test "scripts/release/*.test.mjs"
      - run: pnpm --dir app test
      - run: pnpm --dir app build
      # Uçtan uca arayüz testleri (WebKit, IPC taklidi). Görsel karşılaştırma yalnızca yerelde.
      # WebKit önbelleği Playwright sürümüne (kilit dosyası) bağlı; varsa kurulum indirme yapmaz.
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}
      - run: pnpm --dir app exec playwright install webkit
      - run: pnpm --dir app e2e
      # Başarısız e2e'nin Playwright izleri (trace: retain-on-failure) indirilebilir kalır (M6-4).
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: app/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: rustup toolchain install 1.93 --profile minimal
      - run: cargo +1.93 check -p store -p jyotish-desk --all-targets

  core:
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p ephemeris -p atlas -p jyotish-core -p store --all-targets -- -D warnings
      - run: cargo test -p ephemeris -p atlas -p jyotish-core -p store

  macos-x86_64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm --dir app install --frozen-lockfile
      - run: pnpm --dir app build
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --target x86_64-apple-darwin

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p ephemeris -p atlas -p jyotish-core -p store --all-targets
