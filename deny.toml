[graph]
all-features = true

[licenses]
allow = [
  "AGPL-3.0-or-later",
  "AGPL-3.0",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
]
confidence-threshold = 0.9

[advisories]
yanked = "deny"
# Bakımı bırakılmış crate uyarıları yalnızca doğrudan bağımlılıklarda hata;
# güvenlik açıkları (vulnerability) her durumda hata.
unmaintained = "workspace"

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
